[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reactive-samplers"
version = "0.1.0"
description = "Agent-in-the-loop discovery of adaptive diffusion sampling rules"
requires-python = ">=3.10"
dependencies = ["hydra-core>=1.3,<1.4"]

[project.optional-dependencies]
sd3 = ["torch>=2.5", "diffusers==0.35.1", "transformers>=4.44,<5", "accelerate>=1", "sentencepiece", "protobuf", "Pillow"]
metrics = ["hpsv2", "torchmetrics[multimodal]"]
download = ["huggingface-hub==0.34.4"]

[project.scripts]
reactive-samplers = "reactive_samplers.cli:main"

[tool.setuptools.packages.find]
include = ["reactive_samplers*"]

[tool.setuptools.package-data]
reactive_samplers = ["prompts/*.py", "prompts/*.md"]
