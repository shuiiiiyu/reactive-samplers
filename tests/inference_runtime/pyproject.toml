[project]
name = "reactive-samplers-inference-smoke"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "diffusers==0.35.1",
  "transformers==4.44.2",
  "accelerate==1.10.1",
  "huggingface-hub==0.34.4",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=4,<6",
  "Pillow>=10",
  "numpy>=1.26,<3",
]

[tool.uv]
# The RunPod image supplies torch 2.8.0+cu128; launch script adds its dist-packages.
# Avoid downloading/replacing the image's CUDA stack for this smoke test.
override-dependencies = ["torch; python_version < '0'", "torchvision; python_version < '0'"]
