# SD3 defaults. CLI overrides take precedence; --cfg job only prints the config.
mode: default                     # default | explore | evaluate
method: adaptive_sigma             # adaptive_sigma | grid_skip | prediction_cache | residual_cache
model: sd3
max_consecutive_skips: 4            # cache methods only; trusted maximum consecutive reuse nodes
model_path: models/sd3-medium           # downloaded local Diffusers checkpoint
device: cuda
dtype: bfloat16
height: 1024
width: 1024
guidance_scale: 7.0
max_sequence_length: 256
reference_steps: 28                # Original official schedule length: change SD3 steps here.
max_nfe: ${reference_steps}        # Real backbone budget; can be reduced separately.
prompts: sampler_runs/coco10-grid-20261027/prompts.jsonl
expected_count: 10
output_dir: sampler_runs/${model}-${method}-${now:%Y%m%d-%H%M%S}
policy: null                      # required frozen directory in evaluate mode
baseline_results: null            # optional paired reference feedback for exploration
verify_pipeline: false
policy_timeout_seconds: 30
agent:
  backend: mailbox             # RunPod Codex CLI bridge; start bridge before Slurm job
  command: []                     # trusted bridge argv; {request}, {workspace} placeholders
  timeout_seconds: 1800           # timeout falls back to the previous policy
  poll_seconds: 1
  schedule: every_step            # every_step | checkpoints
  checkpoints: []                 # zero-based executed-step indices
metrics:
  names: []                       # explicitly enable hps_v2_1 and/or clip_score for quality experiments
  clip_model: null
  hps_checkpoint: null
hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .
